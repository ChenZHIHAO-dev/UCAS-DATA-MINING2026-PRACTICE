<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 715" role="img"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#111" stroke="#111" stroke-width="1.5"><path d="M590,255L590,145" fill="none"/><path d="M380,330L325,330" fill="none"/><path d="M800,330L855,330" fill="none"/><path d="M590,450L590,500" fill="none"/><path d="M100,255L100,150" fill="none"/><path d="M100,415L100,500" fill="none"/><path d="M1005,255L1005,145" fill="none"/><rect x="380" y="255" width="420" height="195" fill="white"/><text x="392" y="282" font-size="19" stroke="none">FactEnrollment</text><path d="M380,294h420"/><text x="392" y="319" font-size="15" stroke="none">PK = the four FKs below</text><text x="392" y="343" font-size="15" stroke="none">FK: student_key, course_key</text><text x="392" y="367" font-size="15" stroke="none">FK: semester_key, instructor_key</text><text x="392" y="391" font-size="15" stroke="none">enrollment_count = 1</text><text x="392" y="415" font-size="15" stroke="none">score</text><rect x="445" y="5" width="300" height="140" fill="white"/><text x="457" y="32" font-size="19" stroke="none">DimSemester</text><path d="M445,44h300"/><text x="457" y="69" font-size="15" stroke="none">PK: semester_key</text><text x="457" y="93" font-size="15" stroke="none">semester_label, academic_year</text><rect x="5" y="255" width="320" height="160" fill="white"/><text x="17" y="282" font-size="19" stroke="none">DimStudent</text><path d="M5,294h320"/><text x="17" y="319" font-size="15" stroke="none">PK: student_key; student_id</text><text x="17" y="343" font-size="15" stroke="none">FK: major_key, university_key</text><text x="17" y="367" font-size="15" stroke="none">student_status</text><rect x="5" y="10" width="280" height="140" fill="white"/><text x="17" y="37" font-size="19" stroke="none">DimMajor</text><path d="M5,49h280"/><text x="17" y="74" font-size="15" stroke="none">PK: major_key</text><text x="17" y="98" font-size="15" stroke="none">major_name</text><rect x="5" y="500" width="300" height="130" fill="white"/><text x="17" y="527" font-size="19" stroke="none">DimUniversity</text><path d="M5,539h300"/><text x="17" y="564" font-size="15" stroke="none">PK: university_key</text><text x="17" y="588" font-size="15" stroke="none">university_name</text><rect x="855" y="255" width="315" height="140" fill="white"/><text x="867" y="282" font-size="19" stroke="none">DimCourse</text><path d="M855,294h315"/><text x="867" y="319" font-size="15" stroke="none">PK: course_key; course_id</text><text x="867" y="343" font-size="15" stroke="none">FK: department_key</text><rect x="855" y="5" width="315" height="140" fill="white"/><text x="867" y="32" font-size="19" stroke="none">DimDepartment</text><path d="M855,44h315"/><text x="867" y="69" font-size="15" stroke="none">PK: department_key</text><text x="867" y="93" font-size="15" stroke="none">department_name</text><rect x="445" y="500" width="300" height="130" fill="white"/><text x="457" y="527" font-size="19" stroke="none">DimInstructor</text><path d="M445,539h300"/><text x="457" y="564" font-size="15" stroke="none">PK: instructor_key</text><text x="457" y="588" font-size="15" stroke="none">instructor_id, instructor_name</text><text x="330" y="685" font-size="17" stroke="none">Lines connect each foreign key to its referenced primary key.</text></g></svg>