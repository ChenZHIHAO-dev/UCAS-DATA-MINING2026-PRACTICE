<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="100%" height="100%" fill="white"/><g font-family="Times New Roman,serif" fill="#111"><text x="750.0" y="30" text-anchor="middle" font-size="24">Airline fact constellation: explicit shared dimensions</text><rect x="570" y="60" width="360" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="750.0" y="88" text-anchor="middle" font-size="18">DimPassenger</text><text x="750.0" y="114" text-anchor="middle" font-size="18">PK passenger_key</text><text x="750.0" y="140" text-anchor="middle" font-size="18">is_frequent; tier</text><line x1="410" y1="405" x2="570" y2="115" stroke="#111" stroke-width="1.5"/><line x1="930" y1="115" x2="1080" y2="405" stroke="#111" stroke-width="1.5"/><rect x="570" y="240" width="360" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="750.0" y="268" text-anchor="middle" font-size="18">DimDate</text><text x="750.0" y="294" text-anchor="middle" font-size="18">PK date_key</text><text x="750.0" y="320" text-anchor="middle" font-size="18">calendar_year; season; year_month</text><line x1="410" y1="405" x2="570" y2="295" stroke="#111" stroke-width="1.5"/><line x1="930" y1="295" x2="1080" y2="405" stroke="#111" stroke-width="1.5"/><rect x="570" y="420" width="360" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="750.0" y="448" text-anchor="middle" font-size="18">DimFlightLeg</text><text x="750.0" y="474" text-anchor="middle" font-size="18">PK flight_leg_key</text><text x="750.0" y="500" text-anchor="middle" font-size="18">flight_leg_id; flight_no</text><line x1="410" y1="405" x2="570" y2="475" stroke="#111" stroke-width="1.5"/><line x1="930" y1="475" x2="1080" y2="405" stroke="#111" stroke-width="1.5"/><rect x="570" y="600" width="360" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="750.0" y="628" text-anchor="middle" font-size="18">DimRoute</text><text x="750.0" y="654" text-anchor="middle" font-size="18">PK route_key</text><text x="750.0" y="680" text-anchor="middle" font-size="18">route_code; origin; destination</text><line x1="410" y1="405" x2="570" y2="655" stroke="#111" stroke-width="1.5"/><line x1="930" y1="655" x2="1080" y2="405" stroke="#111" stroke-width="1.5"/><rect x="20" y="320" width="390" height="170" fill="white" stroke="#111" stroke-width="1.6"/><text x="215.0" y="348" text-anchor="middle" font-size="18">FactTravel</text><text x="215.0" y="374" text-anchor="middle" font-size="18">PK/FK passenger_key, flight_leg_key</text><text x="215.0" y="400" text-anchor="middle" font-size="18">FK date_key, route_key</text><text x="215.0" y="426" text-anchor="middle" font-size="18">passenger_count = 1</text><text x="215.0" y="452" text-anchor="middle" font-size="18">fare (optional)</text><rect x="1080" y="320" width="400" height="170" fill="white" stroke="#111" stroke-width="1.6"/><text x="1280.0" y="348" text-anchor="middle" font-size="18">FactCatering</text><text x="1280.0" y="374" text-anchor="middle" font-size="18">PK consumption_key</text><text x="1280.0" y="400" text-anchor="middle" font-size="18">FK passenger_key, flight_leg_key</text><text x="1280.0" y="426" text-anchor="middle" font-size="18">FK date_key, route_key, product_key</text><text x="1280.0" y="452" text-anchor="middle" font-size="18">quantity; amount (optional)</text><rect x="1080" y="650" width="400" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="1280.0" y="678" text-anchor="middle" font-size="18">DimProduct</text><text x="1280.0" y="704" text-anchor="middle" font-size="18">PK product_key</text><text x="1280.0" y="730" text-anchor="middle" font-size="18">product_name; category</text><line x1="1280" y1="490" x2="1280" y2="650" stroke="#111" stroke-width="1.5"/><text x="310" y="780" text-anchor="middle" font-size="20">Travel grain: one passenger on one flight leg.</text><text x="1090" y="780" text-anchor="middle" font-size="20">Catering grain: one re