<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="17" fill="#111" stroke="#111" stroke-width="1.5"><path d="M500,170L500,120" fill="none"/><path d="M350,255L245,255" fill="none"/><path d="M650,255L755,255" fill="none"/><rect x="350" y="170" width="300" height="180" fill="white"/><text x="362" y="195" font-size="19" stroke="none">FactVisit</text><path d="M350,207h300"/><text x="362" y="232" font-size="15" stroke="none">PK: visit_key</text><text x="362" y="255" font-size="15" stroke="none">FK: date_key, doctor_key</text><text x="362" y="278" font-size="15" stroke="none">FK: patient_key</text><text x="362" y="301" font-size="15" stroke="none">visit_count = 1; charge</text><rect x="375" y="10" width="250" height="110" fill="white"/><text x="387" y="35" font-size="19" stroke="none">DimTime</text><path d="M375,47h250"/><text x="387" y="72" font-size="15" stroke="none">PK: date_key</text><text x="387" y="95" font-size="15" stroke="none">day, month, quarter, year</text><rect x="5" y="195" width="240" height="130" fill="white"/><text x="17" y="220" font-size="19" stroke="none">DimDoctor</text><path d="M5,232h240"/><text x="17" y="257" font-size="15" stroke="none">PK: doctor_key</text><text x="17" y="280" font-size="15" stroke="none">doctor_id, specialty</text><rect x="755" y="195" width="240" height="130" fill="white"/><text x="767" y="220" font-size="19" stroke="none">DimPatient</text><path d="M755,232h240"/><text x="767" y="257" font-size="15" stroke="none">PK: patient_key</text><text x="767" y="280" font-size="15" stroke="none">patient_id, age_group</text><text x="230" y="415" font-size="18" stroke="none">Grain: one doctor–patient visit; charge is the fee for that visit.</text></g></svg>