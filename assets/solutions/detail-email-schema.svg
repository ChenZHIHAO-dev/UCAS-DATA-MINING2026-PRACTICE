<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="100%" height="100%" fill="white"/><g font-family="Times New Roman,serif" fill="#111"><text x="700.0" y="30" text-anchor="middle" font-size="24">Email warehouse: one message fact, recipients in a bridge</text><rect x="500" y="60" width="400" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="700.0" y="88" text-anchor="middle" font-size="18">DimTime</text><text x="700.0" y="114" text-anchor="middle" font-size="18">PK time_key</text><text x="700.0" y="140" text-anchor="middle" font-size="18">calendar_year; month; full_timestamp</text><rect x="20" y="265" width="310" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="175.0" y="293" text-anchor="middle" font-size="18">DimSender</text><text x="175.0" y="319" text-anchor="middle" font-size="18">PK sender_key</text><text x="175.0" y="345" text-anchor="middle" font-size="18">sender_address</text><rect x="1070" y="265" width="310" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="1225.0" y="293" text-anchor="middle" font-size="18">DimSubject</text><text x="1225.0" y="319" text-anchor="middle" font-size="18">PK subject_key</text><text x="1225.0" y="345" text-anchor="middle" font-size="18">subject_text</text><rect x="500" y="250" width="400" height="170" fill="white" stroke="#111" stroke-width="1.6"/><text x="700.0" y="278" text-anchor="middle" font-size="18">FactMessage</text><text x="700.0" y="304" text-anchor="middle" font-size="18">PK message_key</text><text x="700.0" y="330" text-anchor="middle" font-size="18">FK sender_key, subject_key</text><text x="700.0" y="356" text-anchor="middle" font-size="18">FK sent_time_key</text><text x="700.0" y="382" text-anchor="middle" font-size="18">message_count = 1; size_bytes</text><rect x="500" y="520" width="400" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="700.0" y="548" text-anchor="middle" font-size="18">BridgeMessageRecipient</text><text x="700.0" y="574" text-anchor="middle" font-size="18">PK/FK message_key, recipient_key</text><text x="700.0" y="600" text-anchor="middle" font-size="18">PK recipient_type (To / CC / BCC)</text><rect x="1070" y="520" width="310" height="110" fill="white" stroke="#111" stroke-width="1.6"/><text x="1225.0" y="548" text-anchor="middle" font-size="18">DimRecipient</text><text x="1225.0" y="574" text-anchor="middle" font-size="18">PK recipient_key</text><text x="1225.0" y="600" text-anchor="middle" font-size="18">recipient_address</text><line x1="700" y1="170" x2="700" y2="250" stroke="#111" stroke-width="1.5"/><line x1="330" y1="320" x2="500" y2="335" stroke="#111" stroke-width="1.5"/><line x1="900" y1="335" x2="1070" y2="320" stroke="#111" stroke-width="1.5"/><line x1="700" y1="420" x2="700" y2="520" stroke="#111" stroke-width="1.5"/><line x1="900" y1="575" x2="1070" y2="575" stroke="#111" stroke-width="1.5"/><text x="700" y="685" text-anchor="middle" font-size="20">Recipient filtering uses EXISTS; each qualifying message is counted once.</text></g></svg>