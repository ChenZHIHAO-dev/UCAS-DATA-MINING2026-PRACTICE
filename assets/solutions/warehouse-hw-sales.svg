<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730"><g font-family="Times New Roman,serif" fill="black"><rect width="1160" height="730" fill="white"/><text x="580" y="32" text-anchor="middle" font-size="22" font-weight="bold">Sales star: one daily product-vendor-location cell</text><rect x="400" y="270" width="360" height="180" fill="white" stroke="black" stroke-width="1.5"/><text x="580.0" y="297" font-size="17" text-anchor="middle">FactSales</text><text x="580.0" y="321" font-size="17" text-anchor="middle">PK (date_key, product_key,</text><text x="580.0" y="345" font-size="17" text-anchor="middle">vendor_key, location_key)</text><text x="580.0" y="369" font-size="17" text-anchor="middle">Four keys are also FKs</text><text x="580.0" y="393" font-size="17" text-anchor="middle">sales_volume; sales_cost</text><rect x="400" y="64" width="360" height="140" fill="white" stroke="black" stroke-width="1.5"/><text x="580.0" y="91" font-size="17" text-anchor="middle">DimDate</text><text x="580.0" y="115" font-size="17" text-anchor="middle">PK date_key; UNIQUE full_date</text><text x="580.0" y="139" font-size="17" text-anchor="middle">year; month; full_date</text><line x1="580" y1="204" x2="580" y2="270" stroke="black" stroke-width="1.5"/><rect x="25" y="270" width="330" height="180" fill="white" stroke="black" stroke-width="1.5"/><text x="190.0" y="297" font-size="17" text-anchor="middle">DimProduct</text><text x="190.0" y="321" font-size="17" text-anchor="middle">PK product_key; UNIQUE product_id</text><text x="190.0" y="345" font-size="17" text-anchor="middle">product_name; category</text><line x1="355" y1="360" x2="400" y2="360" stroke="black" stroke-width="1.5"/><rect x="805" y="270" width="330" height="180" fill="white" stroke="black" stroke-width="1.5"/><text x="970.0" y="297" font-size="17" text-anchor="middle">DimVendor</text><text x="970.0" y="321" font-size="17" text-anchor="middle">PK vendor_key; UNIQUE vendor_id</text><text x="970.0" y="345" font-size="17" text-anchor="middle">vendor_name</text><line x1="760" y1="360" x2="805" y2="360" stroke="black" stroke-width="1.5"/><rect x="400" y="535" width="360" height="150" fill="white" stroke="black" stroke-width="1.5"/><text x="580.0" y="562" font-size="17" text-anchor="middle">DimLocation</text><text x="580.0" y="586" font-size="17" text-anchor="middle">PK location_key; UNIQUE location_id</text><text x="580.0" y="610" font-size="17" text-anchor="middle">city; state; country</text><line x1="580" y1="450" x2="580" y2="535" stroke="black" stroke-width="1.5"/></g></svg>